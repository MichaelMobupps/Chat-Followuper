openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: prospects
    description: Prospect and manual-ingest operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current authenticated user
      description: Returns the currently authenticated user, or 401 when not signed in.
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Clears the session cookie.
      responses:
        "204":
          description: Logged out
  /prospects/{id}/prepare-first-message:
    post:
      operationId: prepareFirstMessage
      tags: [prospects]
      summary: Research and generate first message for a manual contact
      description: |
        Runs prospect research (if needed), generates the stage-0 message via
        the doctrine pipeline, and returns a send-ready deep link.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareFirstMessageRequest"
      responses:
        "200":
          description: Message prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareFirstMessageResponse"
        "404":
          description: Prospect not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Preconditions not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Geo blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /prospects/{id}/telegram-link:
    get:
      operationId: getTelegramLink
      tags: [prospects]
      summary: Telegram deep link for a ready prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Link ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelLinkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Preconditions not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/me/test-channel-link:
    post:
      operationId: postTestChannelLink
      tags: [prospects]
      summary: Build a test WhatsApp or Telegram deep link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestChannelLinkRequest"
      responses:
        "200":
          description: Deep link built
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestChannelLinkResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/me/notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [auth]
      summary: Read Pushover notification settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
    patch:
      operationId: patchNotificationSettings
      tags: [auth]
      summary: Update Pushover user key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/me/test-pushover:
    post:
      operationId: postTestPushover
      tags: [auth]
      summary: Send a test Pushover notification
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "409":
          description: User key missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Pushover not configured on server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
      required:
        - id
        - email
        - name
    AuthError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ApiError:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
      required:
        - error
    PrepareFirstMessageRequest:
      type: object
      properties:
        channel:
          type: string
          enum: [whatsapp, telegram, teams, slack]
    PrepareFirstMessageResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, research_complete, already_ready]
        prospectId:
          type: string
          format: uuid
        message:
          type: string
          nullable: true
        deepLinkUrl:
          type: string
          nullable: true
        researchCostUsd:
          type: number
        generationCostUsd:
          type: number
      required:
        - status
        - prospectId
        - message
        - deepLinkUrl
    ChannelLinkResponse:
      type: object
      properties:
        url:
          type: string
        body:
          type: string
      required:
        - url
        - body
    TestChannelLinkRequest:
      type: object
      properties:
        channel:
          type: string
          enum: [whatsapp, telegram]
        identifier:
          type: string
        message:
          type: string
      required:
        - channel
        - identifier
    TestChannelLinkResponse:
      type: object
      properties:
        channel:
          type: string
          enum: [whatsapp, telegram]
        deepLinkUrl:
          type: string
        message:
          type: string
        target:
          type: string
      required:
        - channel
        - deepLinkUrl
        - message
        - target
    NotificationSettings:
      type: object
      properties:
        # API7: the raw pushoverUserKey is never returned — only the masked form.
        # (It is still accepted in NotificationSettingsPatch to SET a new key.)
        pushoverUserKeyMasked:
          type: string
          nullable: true
        pushoverEnabled:
          type: boolean
        pushoverAppConfigured:
          type: boolean
      required:
        - pushoverUserKeyMasked
        - pushoverEnabled
        - pushoverAppConfigured
    NotificationSettingsPatch:
      type: object
      properties:
        pushoverUserKey:
          type: string
          nullable: true
